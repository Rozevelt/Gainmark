<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the status bar and home indicator, like a native app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Gainmark</title>

    <!-- Home-screen app (iPhone and Android): opens fullscreen, without the browser's bars. -->
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gainmark" />
    <link rel="manifest" href="/Gainmark/manifest.json" />
    <link rel="apple-touch-icon" href="/Gainmark/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/Gainmark/icon-192.png" />

    <style id="expo-reset">
      /* The page itself never moves: pinned to the screen, so iOS can't scroll the app's top bar
         out of view (e.g. when the keyboard opens). Only the app's own lists scroll. */
      html,
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #111111;
      }
      body {
        /* No rubber-band bounce or pull-to-refresh on the whole page. */
        overscroll-behavior: none;
        /* Feel like an app: no grey tap flashes, no text selection or "Copy" menu on long-press
           (long-press is used to pick up move cards). Typing in fields still works. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // iOS scrolls the page up to show a text box above the keyboard, and doesn't always scroll
      // back when the keyboard closes. Put it back, so the top bar is always in view.
      (function () {
        function backToTop() {
          if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
        }
        window.addEventListener('focusout', function () {
          setTimeout(backToTop, 80);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            // Keyboard closed (the visible area is full height again).
            if (window.visualViewport.height >= window.innerHeight - 1) setTimeout(backToTop, 80);
          });
        }
      })();

      // Offline support: keeps the app working without a connection.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/Gainmark/sw.js', { scope: '/Gainmark/' }).catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Gainmark.</noscript>
    <div id="root"></div>
  </body>
</html>
